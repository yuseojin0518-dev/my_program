<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4f6" />
  <meta name="description" content="진로 목표에서 오늘 할 공부까지 이어 주는 고등학생 학업 내비게이션. 내신 역산, 최적 시간 배분, 자동 재조정, 선택과목 추천." />
  <title>Pathway · 고등학생 학업 내비게이션</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}" />
  <!-- Pretendard 글꼴 (SIL 오픈 폰트 라이선스, 무료) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}?v={{ v }}" />
  <script>
    // 그리기 전에 밝기부터 (깜빡임 방지)
    try { document.documentElement.dataset.theme = localStorage.getItem("pw.theme") || "light"; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header id="topbar">
    <button class="brand" data-act="go" data-tab="home" aria-label="Pathway 대시보드">
      <span class="brand-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="var(--accent)"/><path d="M12 34c6-1 8-6 12-12s7-9 12-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="12" cy="34" r="4" fill="#fff"/><path d="M33 9l5 3-4 4" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">Pathway</span>
    </button>
    <button id="goal-chip" class="goal-chip" data-act="go" data-tab="path" hidden></button>
    <div class="spacer"></div>
    <span id="sync" class="sync local" aria-live="polite">이 기기에 저장</span>
    <button class="icon-btn" data-act="settings" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-account" class="pill" data-act="account">로그인</button>
  </header>

  <nav id="nav" aria-label="주요 화면" hidden>
    <div class="side-h">메뉴</div>
    <button data-act="go" data-tab="home"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1h-5v-6.2h-5V21h-5a1 1 0 0 1-1-1z"/></svg><b>대시보드</b></button>
    <button data-act="go" data-tab="path"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="8.5"/><circle fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><b>진로·과목</b></button>
    <button data-act="go" data-tab="grades"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><b>성적</b></button>
    <button data-act="go" data-tab="plan"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" x="3.5" y="5" width="17" height="15.5" rx="3"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg><b>계획</b></button>
    <button data-act="go" data-tab="report"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3.5 19.5h17M5 15l4.5-4.5 3.5 3 6-6.5"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M15 7h4v4"/></svg><b>리포트</b></button>
    <div id="side-extra" class="side-extra" aria-label="요약"></div>
  </nav>

  <main id="main" tabindex="-1"></main>

  <div id="modal" aria-hidden="false"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Pathway는 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
  <script src="{{ url_for('static', filename='engine.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='data.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='ui.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='views-home.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='views-grades.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='views-plan.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='views-path.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='views-report.js') }}?v={{ v }}"></script>
</body>
</html>
